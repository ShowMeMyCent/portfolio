<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio website showcasing my work and skills"
    />
    <title>Wildan Khalid Wijaya - Portfolio</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./resource/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./resource/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./resource/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./resource/apple-touch-icon.png"
    />
    <link rel="shortcut icon" href="./resource/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.45/dist/katex.min.css"
      integrity="sha384-UA8juhPf75SzzAMA/4fo3yOU7sBJ0om7SCD2GHq0fZqZco6tr1UCV7nUbk9J90JM"
      crossorigin="anonymous"
    />

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.45/dist/katex.min.js"
      integrity="sha384-Tt7wBxLKwSzFVRET4O4U9H6v8MNaQ/CjN2FMP4xFm0ErrFu6aNqoonRVW5W40iGI"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.45/dist/contrib/auto-render.min.js"
      integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz"
      crossorigin="anonymous"
    ></script>

    <link href="./src/output.css" rel="stylesheet" />

    <!-- Font Awesome CDN -->
    <script
      src="https://kit.fontawesome.com/1df0f1098c.js"
      crossorigin="anonymous"
    ></script>
    <!-- Alternative Font Awesome CDN (if kit fails) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
      integrity="sha384-9tYx5MNgqTt1p2pLl0g8Jf6i7b9n5F1DcPQfCnyf8Gb0a0vFTnWkA0EU6t1zJx4F"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
      integrity="sha384-5hl5vQH4Q+qC9w11B8fYg4Cf5K1BLtQfFZxri8c1flVY0a4uU3E5r3lKp1Lj2Z0Z"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="grid-surface">
    <div id="equation-bg" class="equation-bg" aria-hidden="true"></div>

    <div id="site-clock" class="site-clock" aria-live="polite"></div>

    <div id="engine-intro" class="engine-intro" aria-hidden="true">
      <div class="engine-panel">
        <p class="engine-kicker">Startup</p>
        <h2>Starting Engine Sequence</h2>
        <p id="engine-step" class="engine-step">Initializing telemetry...</p>
        <div class="engine-progress-track">
          <div id="engine-progress" class="engine-progress-fill"></div>
        </div>
        <p id="engine-time" class="engine-time"></p>
      </div>
    </div>

    <!-- Component Containers -->
    <div id="hero-component"></div>
    <div id="about-component"></div>
    <div id="education-component"></div>
    <div id="skills-component"></div>
    <div id="experience-component"></div>
    <div id="projects-component"></div>
    <div id="contact-component"></div>
    <div id="footer-component"></div>

    <!-- JavaScript -->
    <script src="./js/main.js"></script>
  </body>
</html>
