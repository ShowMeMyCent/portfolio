<!-- Contact Section -->
<section id="contact" class="section-shell">
  <div class="container-shell">
    <div class="section-head">
      <p class="eyebrow">Comms Array</p>
      <h2 class="section-title">Get In Touch</h2>
      <p class="section-subtitle">
        Have a project in mind or want to collaborate? I'd love to hear from
        you.
      </p>
    </div>

    <div class="contact-grid">
      <div class="panel">
        <h3 class="text-2xl font-bold mb-6">Let's Connect</h3>
        <div class="space-y-6">
          <div class="flex items-center gap-4">
            <div class="skill-icon">
              <a href="mailto:wildankh01@outlook.com">
                <i class="fas fa-envelope"></i>
              </a>
            </div>
            <div>
              <h4 class="font-semibold">Email</h4>
              <p class="text-slate-200">wildankh01@outlook.com</p>
            </div>
          </div>

          <div class="flex items-center gap-4">
            <div class="skill-icon">
              <a href="tel:+6282119761448">
                <i class="fas fa-phone"></i>
              </a>
            </div>
            <div>
              <h4 class="font-semibold">Phone</h4>
              <p class="text-slate-200">+62 821 1976 1448</p>
            </div>
          </div>

          <div class="flex items-center gap-4">
            <div class="skill-icon">
              <i class="fas fa-map-marker-alt"></i>
            </div>
            <div>
              <h4 class="font-semibold">Location</h4>
              <p class="text-slate-200">Bandung, Indonesia</p>
            </div>
          </div>
        </div>

        <div class="mt-8">
          <h4 class="font-semibold mb-4">Follow Me</h4>
          <div class="flex gap-4">
            <a href="https://github.com/ShowMeMyCent" class="btn-ghost">
              <i class="fab fa-github"></i>
            </a>
            <a
              href="https://www.linkedin.com/in/wildan-khalid-wijaya/"
              class="btn-ghost"
            >
              <i class="fab fa-linkedin"></i>
            </a>
            <a href="https://www.instagram.com/showmemycent/" class="btn-ghost">
              <i class="fab fa-instagram"></i>
            </a>
          </div>
        </div>
      </div>

      <div class="contact-panel">
        <form class="space-y-6">
          <div>
            <label for="name" class="block text-sm font-medium mb-2"
              >Name</label
            >
            <input
              type="text"
              id="name"
              name="name"
              class="w-full px-4 py-3 rounded-lg border border-white/10 bg-white/5 focus:ring-2 focus:ring-cyan-300 focus:border-transparent"
              placeholder="Your name"
            />
          </div>

          <div>
            <label for="email" class="block text-sm font-medium mb-2"
              >Email</label
            >
            <input
              type="email"
              id="email"
              name="email"
              class="w-full px-4 py-3 rounded-lg border border-white/10 bg-white/5 focus:ring-2 focus:ring-cyan-300 focus:border-transparent"
              placeholder="your.email@example.com"
            />
          </div>

          <div>
            <label for="subject" class="block text-sm font-medium mb-2">
              Subject
            </label>
            <input
              type="text"
              id="subject"
              name="subject"
              class="w-full px-4 py-3 rounded-lg border border-white/10 bg-white/5 focus:ring-2 focus:ring-cyan-300 focus:border-transparent"
              placeholder="Project discussion"
            />
          </div>

          <div>
            <label for="message" class="block text-sm font-medium mb-2">
              Message
            </label>
            <textarea
              id="message"
              name="message"
              rows="4"
              class="w-full px-4 py-3 rounded-lg border border-white/10 bg-white/5 focus:ring-2 focus:ring-cyan-300 focus:border-transparent"
              placeholder="Tell me about your project..."
            ></textarea>
          </div>

          <button type="submit" class="btn-primary w-full">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</section>
